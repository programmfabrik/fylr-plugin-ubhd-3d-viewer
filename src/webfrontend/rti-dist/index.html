<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./vendor/skin.css">
  <link rel="stylesheet" href="./vendor/light.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #1a1a1a; overflow: hidden; }
    .openlime { width: 100%; height: 100%; }
    #rti-error { color: #ccc; font-family: sans-serif; padding: 2em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="openlime"></div>
  <script src="./vendor/jszip.min.js"></script>
  <script src="./vendor/openlime.min.js"></script>
  <script>
    (function () {
      const params   = new URLSearchParams(location.search);
      const accessToken = params.get('access_token');
      let assetUrl = params.get('asset');
      let configUrl = params.get('config') || '';
      const zipName  = params.get('filename') || '';

      // access_token kommt als eigener, flacher Query-Parameter (siehe UBHD3DViewerPlugin.coffee)
      // und wird hier erst vor der Verwendung wieder an die jeweilige URL angehaengt.
      function withAccessToken(url) {
        if (url && accessToken && !/[?&]access_token=/.test(url)) {
          const separator = url.includes('?') ? '&' : '?';
          return `${url}${separator}access_token=${encodeURIComponent(accessToken)}`;
        }
        return url;
      }
      assetUrl = withAccessToken(assetUrl);
      configUrl = withAccessToken(configUrl);

      // Optionale, pro Asset hinterlegte 3D_viewer.json mit einem "rti"-Abschnitt
      // ({ mode, light: {x,y}, camera: {x,y,z,a} }). Fehlt sie oder das Fetch schlaegt fehl,
      // wird einfach mit den OpenLIME-Standardwerten weitergemacht (nicht fatal).
      function loadRtiDefaults(url) {
        if (!url) return Promise.resolve(null);
        return fetch(url, { credentials: 'include', cache: 'no-store' })
          .then(r => r.ok ? r.json() : null)
          .then(json => json && json.rti || null)
          .catch(err => { console.warn('[UBHD3DViewer:rti] loadRtiDefaults failed', err); return null; });
      }

      console.debug('[UBHD3DViewer:rti] location.search=', location.search, 'zipName=', zipName, 'access_token present=', !!accessToken);

      function showError(msg) {
        console.error('[UBHD3DViewer:rti]', msg);
        const div = document.createElement('div');
        div.id = 'rti-error';
        div.textContent = 'RTI konnte nicht geladen werden:\n\n' + msg;
        document.querySelector('.openlime').innerHTML = '';
        document.querySelector('.openlime').appendChild(div);
      }

      if (!assetUrl) { showError('Kein Asset angegeben.'); return; }

      // Nur .rti.zip-Dateien: FYLR liefert ZIP-Originale unter …/original.zip
      function isRtiZip(url, name) {
        return /\/original\.zip$/.test(url.split('?')[0]) && /\.rti\.zip$/i.test(name);
      }

      function mimeFor(ext) {
        return ({ json: 'application/json', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png' })[ext]
          || 'application/octet-stream';
      }

      // Laedt das ZIP per FYLR-URL, entpackt es im Browser und bedient OpenLIME
      // ueber virtuelle URLs (fetch-Interceptor fuer info.json, img.src-Interceptor
      // fuer Plane-Bilder). FYLRs {zippath}-Endpoint liefert 400 fuer rohe Originale.
      function loadFromZip(zipUrl, name) {
        const base = `${location.origin}/_rti_zip_/${Date.now().toString(36)}/`;
        console.debug('[UBHD3DViewer:rti] loadFromZip: fetching', zipUrl);

        return fetch(zipUrl, { credentials: 'include', cache: 'no-store' })
          .then(r => {
            console.debug('[UBHD3DViewer:rti] loadFromZip: fetch status=', r.status, 'for', zipUrl);
            return r.ok ? r.arrayBuffer() : Promise.reject(new Error(`ZIP nicht erreichbar (HTTP\u00a0${r.status}).`));
          })
          .then(buf => JSZip.loadAsync(buf))
          .then(zip => {
            // info.json suchen: Wurzel → Unterordner (foo.rti.zip → foo) → Tiefensuche
            let prefix = '';
            if (!zip.file('info.json')) {
              const sub = name.replace(/\.(rti|unpack)\.zip$/i, '');
              if (zip.file(sub + '/info.json')) {
                prefix = sub + '/';
              } else {
                zip.forEach(p => { if (!prefix && /(?:^|\/)info\.json$/.test(p)) prefix = p.slice(0, p.lastIndexOf('/') + 1); });
                if (!zip.file(prefix + 'info.json'))
                  throw new Error('info.json nicht im ZIP.\nZIP erstellen: cd [rti-ordner] && zip -r foo.rti.zip .');
              }
            }

            // Dateien relativ zum info.json-Verzeichnis als Blobs bereitstellen
            const fileMap = {};
            return Promise.all(
              Object.values(zip.files)
                .filter(f => !f.dir && (!prefix || f.name.startsWith(prefix)))
                .map(f => f.async('arraybuffer').then(buf => {
                  const rel = f.name.slice(prefix.length);
                  if (rel) fileMap[base + rel] = new Blob([buf], { type: mimeFor(rel.split('.').pop().toLowerCase()) });
                }))
            ).then(() => {
              // fetch-Interceptor: info.json aus dem RAM liefern
              const _fetch = window.fetch;
              window.fetch = (input, opts) => {
                const url = input instanceof Request ? input.url : String(input);
                const blob = fileMap[url];
                return blob ? Promise.resolve(new Response(blob, { status: 200 })) : _fetch.call(window, input, opts);
              };

              // img.src-Interceptor: Plane-Bilder als Object-URLs liefern
              // (OpenLIME nutzt document.createElement('img'), nicht new Image())
              const sd = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
              Object.defineProperty(HTMLImageElement.prototype, 'src', {
                configurable: true, enumerable: true,
                get() { return sd.get.call(this); },
                set(url) {
                  const blob = fileMap[String(url)];
                  sd.set.call(this, blob ? URL.createObjectURL(blob) : url);
                }
              });

              return base + 'info.json';
            });
          });
      }

      function initViewer(url, rtiDefaults) {
        console.debug('[UBHD3DViewer:rti] initViewer: url=', url, 'rtiDefaults=', rtiDefaults);
        const viewer = new OpenLIME.Viewer('.openlime');
        const layer = new OpenLIME.Layer({ type: 'rti', url, layout: 'image' });
        viewer.addLayer('rti', layer);
        OpenLIME.Skin.setUrl('./skin/skin.svg');

        // Default "diffuse" (gleichmaessig ausgeleuchtet) statt des interaktiven "light"-Modus,
        // der ohne eigens gesetzte Lichtrichtung ueberlichtet wirkt. Wer explizit eine
        // Lichtrichtung oder einen anderen Modus konfiguriert, bekommt weiterhin "light".
        const mode = (rtiDefaults && rtiDefaults.mode) || (rtiDefaults && rtiDefaults.light ? 'light' : 'diffuse');

        const ui = new OpenLIME.UIBasic(viewer, { showLightDirections: true });
        ui.actions.light.active = true;
        ui.actions.zoomin.display = ui.actions.zoomout.display =
          ui.actions.fullscreen.display = ui.actions.home.display = true;

        function applyDefaults() {
          try {
            layer.setMode(mode);
          } catch (err) {
            console.warn('[UBHD3DViewer:rti] setMode failed for mode=', mode, err);
          }
          if (rtiDefaults && rtiDefaults.light) {
            layer.setLight([rtiDefaults.light.x || 0, rtiDefaults.light.y || 0], 0);
          }
          if (rtiDefaults && rtiDefaults.camera) {
            const c = rtiDefaults.camera;
            viewer.camera.setPosition(0, c.x || 0, c.y || 0, c.z || 1, c.a || 0);
          }
        }

        // setMode/setLight brauchen einen initialisierten Shader; camera.setPosition soll erst
        // nach OpenLIMEs eigenem Autofit (canvas 'ready') greifen, sonst wird es ueberschrieben.
        if (layer.status === 'ready') {
          applyDefaults();
        } else {
          layer.addEvent('ready', applyDefaults);
        }
      }

      // OpenLIME erwartet an dieser URL ein Web-RTI-Manifest (info.json) und parst dessen Inhalt
      // direkt als JSON. Rohe .rti/.ptm-Originale (ohne vorherige Relight-Konvertierung) sind kein
      // JSON, was in OpenLIME sonst als unbehandelter "JSON.parse"-Fehler ohne Nutzerfeedback endet.
      // Deshalb hier vorab pruefen und eine verstaendliche Fehlermeldung anzeigen.
      function validateInfoJson(url) {
        return fetch(url, { credentials: 'include', cache: 'no-store' })
          .then(r => {
            if (!r.ok) throw new Error(`Manifest nicht erreichbar (HTTP\u00a0${r.status}).`);
            return r.text();
          })
          .then(text => {
            try {
              JSON.parse(text);
            } catch (e) {
              throw new Error('Diese Datei ist kein gueltiges Web-RTI-Manifest (info.json). Rohe .rti/.ptm-Originale koennen nicht direkt angezeigt werden - sie muessen zuerst ueber das Rezept "RTI-Viewer (Relight)" in ein Web-RTI-Paket (info.json + Bilder, als ZIP) konvertiert werden.');
            }
            return url;
          });
      }

      Promise.all([
        isRtiZip(assetUrl, zipName) ? loadFromZip(assetUrl, zipName) : validateInfoJson(assetUrl),
        loadRtiDefaults(configUrl)
      ])
        .then(([url, rtiDefaults]) => initViewer(url, rtiDefaults))
        .catch(err => showError(err && err.message ? err.message : String(err)));
    })();
  </script>
</body>
</html>
